<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ClinicalAnalytics medical data science showcase</title>
  <desc id="desc">A polished README preview for a medical data science project matrix covering surgery statistics, image quality, clinical benchmarks, and cardiac signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="56" y="50" width="1088" height="575" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="56" y="50" width="1088" height="122" rx="28" fill="#111827"/>
  <rect x="56" y="136" width="1088" height="36" fill="#111827"/>
  <text x="96" y="104" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700">ClinicalAnalytics</text>
  <text x="96" y="141" fill="#99f6e4" font-family="Arial, sans-serif" font-size="18">Medical statistics, image quality, clinical ML, and ECG signal mining</text>
  <rect x="898" y="82" width="198" height="44" rx="22" fill="#f59e0b"/>
  <text x="934" y="110" fill="#111827" font-family="Arial, sans-serif" font-size="15" font-weight="700">4 Project Matrix</text>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="208" width="476" height="140" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="126" y="254" fill="#0f172a" font-size="26" font-weight="700">SurgeryStats</text>
    <text x="126" y="286" fill="#64748b" font-size="15">surgical timing, error scores, gaze sparsity</text>
    <rect x="426" y="244" width="28" height="68" fill="#2563eb"/>
    <rect x="464" y="266" width="28" height="46" fill="#60a5fa"/>
    <rect x="502" y="282" width="28" height="30" fill="#93c5fd"/>

    <rect x="628" y="208" width="472" height="140" rx="22" fill="#ffffff" stroke="#fef3c7"/>
    <text x="658" y="254" fill="#0f172a" font-size="26" font-weight="700">ImageQuality</text>
    <text x="658" y="286" fill="#64748b" font-size="15">TOE scoring, SSIM, registration features</text>
    <circle cx="958" cy="276" r="34" fill="#fef3c7" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="1008" cy="276" r="34" fill="none" stroke="#14b8a6" stroke-width="5"/>

    <rect x="96" y="390" width="476" height="140" rx="22" fill="#ffffff" stroke="#dcfce7"/>
    <text x="126" y="436" fill="#0f172a" font-size="26" font-weight="700">ClinicalBenchmarks</text>
    <text x="126" y="468" fill="#64748b" font-size="15">surgical skill and COVID CT classifiers</text>
    <path d="M416 486 C448 424 482 504 528 432" fill="none" stroke="#22c55e" stroke-width="7"/>

    <rect x="628" y="390" width="472" height="140" rx="22" fill="#ffffff" stroke="#fce7f3"/>
    <text x="658" y="436" fill="#0f172a" font-size="26" font-weight="700">CardiacSignals</text>
    <text x="658" y="468" fill="#64748b" font-size="15">ECG clustering, ARIMA, association rules</text>
    <path d="M918 462 h34 l14 -38 24 86 18 -48 h62" fill="none" stroke="#db2777" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="558" width="238" height="44" rx="22" fill="#ccfbf1"/>
    <text x="131" y="586" fill="#0f766e" font-size="15" font-weight="700">ImageQuality data included</text>
    <rect x="364" y="558" width="214" height="44" rx="22" fill="#dbeafe"/>
    <text x="406" y="586" fill="#1d4ed8" font-size="15" font-weight="700">6 structure tests</text>
    <rect x="608" y="558" width="238" height="44" rx="22" fill="#fef3c7"/>
    <text x="648" y="586" fill="#92400e" font-size="15" font-weight="700">data-boundary notes</text>
    <rect x="876" y="558" width="224" height="44" rx="22" fill="#fce7f3"/>
    <text x="912" y="586" fill="#be185d" font-size="15" font-weight="700">function-named modules</text>
  </g>
</svg>
