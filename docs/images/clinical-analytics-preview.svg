    <text x="26" y="42" fill="#46310f" font-family="Arial, sans-serif" font-size="22" font-weight="700">ImageQuality</text>
    <text x="26" y="72" fill="#6b531f" font-family="Arial, sans-serif" font-size="14">TOE scoring, SSIM, alignment</text>
    <circle cx="288" cy="64" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="330" cy="64" r="28" fill="none" stroke="#10b981" stroke-width="5"/>
  </g>
  <g transform="translate(86 332)">
