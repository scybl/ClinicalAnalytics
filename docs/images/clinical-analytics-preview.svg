  <rect x="46" y="42" width="908" height="476" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="82" y="92" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">ClinicalAnalytics</text>
  <text x="82" y="124" fill="#647184" font-family="Arial, sans-serif" font-size="17">Medical statistics, image quality, clinical ML, and ECG signal mining</text>

  <g transform="translate(86 170)">
    <rect width="390" height="126" rx="14" fill="#eef7ff" stroke="#9cccf2"/>
