<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">ClinicalAnalytics project matrix preview</title>
  <desc id="desc">A four project medical analytics matrix covering surgery statistics, image quality, clinical ML, and ECG mining.</desc>
