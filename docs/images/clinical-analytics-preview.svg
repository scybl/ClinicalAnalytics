    <text x="26" y="72" fill="#40566d" font-family="Arial, sans-serif" font-size="14">Timing, errors, gaze sparsity</text>
    <rect x="260" y="34" width="24" height="62" fill="#1f6feb"/>
    <rect x="292" y="52" width="24" height="44" fill="#60a5fa"/>
    <rect x="324" y="68" width="24" height="28" fill="#93c5fd"/>
  </g>
  <g transform="translate(524 170)">
